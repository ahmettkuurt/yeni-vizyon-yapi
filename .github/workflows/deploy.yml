name: React Otomatik Build ve Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Kodları Çek
      uses: actions/checkout@v4

    - name: Node.js Kurulumu
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Bağımlılıkları Yükle
      run: npm ci

    - name: Projeyi Derle (Build)
      run: npm run build

    - name: Dosyaları Sunucuya Gönder
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: 94.73.147.156
        username: u2680154
        password: ${{ secrets.FTP_PASSWORD }}
        # Sadece build çıktısı (dist) gönderilir
        local-dir: ./dist/
        server-dir: public_html/
        dangerous-clean-slate: false