<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sayfa bulunamadı | Yeni Vizyon Yapı</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        padding: 24px; background: #0d2137; color: #fff;
        font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 520px; text-align: center; }
      img { width: 120px; height: auto; margin: 0 auto 28px; display: block; }
      .code { font-family: Georgia, "Times New Roman", serif; font-size: 72px; font-weight: 700; line-height: 1; color: #e8b84b; margin: 0; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-size: 28px; margin: 12px 0 10px; }
      p { color: rgba(255,255,255,.8); line-height: 1.6; margin: 0 0 28px; }
      nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      a { display: inline-block; padding: 11px 20px; border-radius: 8px; font-weight: 700; text-decoration: none; }
      .gold { background: #d4a843; color: #0d2137; }
      .line { border: 1px solid rgba(255,255,255,.45); color: #fff; }
      a:focus-visible { outline: 3px solid #1976d2; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/logo.png" alt="Yeni Vizyon Yapı" />
      <p class="code">404</p>
      <h1>Aradığınız sayfa bulunamadı</h1>
      <p>Sayfa taşınmış ya da kaldırılmış olabilir. Ana sayfadan veya ürün kataloğumuzdan devam edebilirsiniz.</p>
      <nav>
        <a class="gold" href="/">Ana sayfa</a>
        <a class="line" href="/katalog/">Ürün kataloğu</a>
        <a class="line" href="tel:+905324498536">0532 449 85 36</a>
      </nav>
    </main>
  </body>
</html>
